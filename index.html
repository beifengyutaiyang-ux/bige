<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写实三色比格犬公园模拟器</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    overflow: hidden;
    background: #2c4a26;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(20, 32, 18, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #f3f7f0;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    min-width: 220px;
    pointer-events: none;
  }
  .hud-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .status-badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 99px;
    background: rgba(126, 200, 80, 0.25);
    color: #b7f28b;
    font-weight: 600;
  }
  .bar-row {
    margin-bottom: 8px;
  }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #cdd8c8;
    margin-bottom: 4px;
  }
  .bar-bg {
    width: 100%;
    height: 7px;
    background: rgba(255, 255, 255, 0.14);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.2s ease;
  }
  #pee-bar { background: linear-gradient(90deg, #f6d365, #fda085); }
  #poop-bar { background: linear-gradient(90deg, #a17a50, #754c24); }
  .hud-tip {
    margin-top: 8px;
    font-size: 11px;
    color: #a9b8a3;
  }
  #controls {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    background: rgba(20, 32, 18, 0.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 14px;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    flex-wrap: wrap;
    justify-content: center;
    max-width: 94vw;
  }
  button {
    border: none;
    outline: none;
    padding: 9px 15px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    transition: transform 0.12s ease, background 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  button:hover {
    background: rgba(255, 255, 255, 0.22);
    transform: translateY(-1px);
  }
  button:active {
    transform: translateY(1px);
  }
  .btn-water { background: rgba(56, 163, 224, 0.35); border: 1px solid rgba(56, 163, 224, 0.5); }
  .btn-food  { background: rgba(219, 134, 59, 0.35); border: 1px solid rgba(219, 134, 59, 0.5); }
  .btn-pee   { background: rgba(235, 186, 52, 0.35); border: 1px solid rgba(235, 186, 52, 0.5); }
  .btn-poop  { background: rgba(145, 93, 47, 0.45); border: 1px solid rgba(181, 121, 67, 0.6); }
  .btn-clean { background: rgba(88, 179, 104, 0.35); border: 1px solid rgba(88, 179, 104, 0.5); }
</style>
</head>
<body>

<canvas id="park"></canvas>

<div id="hud">
  <div class="hud-title">
    <span>🐶 巴迪 (比格犬)</span>
    <span class="status-badge" id="state-text">悠闲散步</span>
  </div>
  <div class="bar-row">
    <div class="bar-label"><span>💧 尿意积攒</span><span id="pee-pct">25%</span></div>
    <div class="bar-bg"><div class="bar-fill" id="pee-bar" style="width: 25%"></div></div>
  </div>
  <div class="bar-row">
    <div class="bar-label"><span>💩 便意积攒</span><span id="poop-pct">20%</span></div>
    <div class="bar-bg"><div class="bar-fill" id="poop-bar" style="width: 20%"></div></div>
  </div>
  <div class="hud-tip">💡 点击草地引导散步 · 点击排泄物清理</div>
</div>

<div id="controls">
  <button class="btn-water" onclick="giveWater()">💧 喂喝水</button>
  <button class="btn-food" onclick="giveFood()">🦴 喂狗粮</button>
  <button class="btn-pee" onclick="forcePee()">💦 立刻撒尿</button>
  <button class="btn-poop" onclick="forcePoop()">💩 立刻拉屎</button>
  <button class="btn-clean" onclick="cleanAll()">🧹 一键铲屎</button>
</div>

<script>
const canvas = document.getElementById('park');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  generateGrassTufts();
});

// Web Audio API 音效合成
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playBark() {
  try {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 0.06);
    osc.frequency.exponentialRampToValueAtTime(210, now + 0.18);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 650;
    filter.Q.value = 2.0;

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.21);
  } catch (e) {}
}

let peeNoiseNode = null;
let peeGainNode = null;
function startPeeSound() {
  try {
    initAudio();
    if (peeNoiseNode) return;
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    peeNoiseNode = audioCtx.createBufferSource();
    peeNoiseNode.buffer = buffer;
    peeNoiseNode.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1400;
    filter.Q.value = 1.8;

    peeGainNode = audioCtx.createGain();
    peeGainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
    peeGainNode.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime + 0.3);

    peeNoiseNode.connect(filter);
    filter.connect(peeGainNode);
    peeGainNode.connect(audioCtx.destination);
    peeNoiseNode.start();
  } catch (e) {}
}

function stopPeeSound() {
  try {
    if (peeNoiseNode && peeGainNode) {
      peeGainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
      const node = peeNoiseNode;
      setTimeout(() => { try { node.stop(); } catch(e){} }, 220);
      peeNoiseNode = null;
      peeGainNode = null;
    }
  } catch (e) {}
}

function playPopSound() {
  try {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(480, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  } catch (e) {}
}

// 草地纹理点缀
let grassTufts = [];
let dandelions = [];
function generateGrassTufts() {
  grassTufts = [];
  dandelions = [];
  const count = Math.floor((width * height) / 4200);
  for (let i = 0; i < count; i++) {
    grassTufts.push({
      x: Math.random() * width,
      y: height * 0.22 + Math.random() * (height * 0.78),
      h: 6 + Math.random() * 10,
      lean: (Math.random() - 0.5) * 8,
      shade: Math.random() > 0.5 ? '#3b6e32' : '#589448'
    });
  }
  for (let i = 0; i < 24; i++) {
    dandelions.push({
      x: Math.random() * width,
      y: height * 0.25 + Math.random() * (height * 0.72),
      r: 3 + Math.random() * 2.5,
      isWhite: Math.random() > 0.75
    });
  }
}
generateGrassTufts();

// 地面排泄物、食物与交互特效
const puddles = [];
const poops = [];
const treats = [];
const particles = [];

// 比格犬对象
const beagle = {
  x: width * 0.5,
  y: height * 0.62,
  targetX: width * 0.65,
  targetY: height * 0.65,
  dir: 1, // 1: 向右, -1: 向左
  state: 'walk', // walk, idle, sniff, circle, pee, poop, eat
  stateTimer: 3.5,
  walkPhase: 0,
  breathPhase: 0,
  tailPhase: 0,
  blinkTimer: 2.5,
  isBlinking: false,
  peeMeter: 25,
  poopMeter: 20,
  circleAngle: 0,
  circleCenterX: 0,
  circleCenterY: 0,
  actionProgress: 0,
  poopDropped: false,
  activePuddle: null,
  happyTimer: 0
};

function setState(newState, duration) {
  if (beagle.state === 'pee') stopPeeSound();
  beagle.state = newState;
  beagle.stateTimer = duration;
  beagle.actionProgress = 0;

  const badge = document.getElementById('state-text');
  const map = {
    walk: '悠闲散步',
    idle: '四处张望',
    sniff: '低头嗅闻',
    circle: '原地转圈选址',
    pee: '抬腿撒尿中...',
    poop: '弓背用力拉屎中...',
    eat: '开心进食中'
  };
  badge.textContent = map[newState] || '悠闲散步';
}

function pickRandomTarget() {
  const marginX = 110;
  const minY = height * 0.30;
  const maxY = height * 0.88;
  beagle.targetX = marginX + Math.random() * Math.max(100, width - marginX * 2);
  beagle.targetY = minY + Math.random() * Math.max(80, maxY - minY);
}

function startPeeSequence() {
  const puddle = {
    x: beagle.x - beagle.dir * 26,
    y: beagle.y + 34,
    rx: 6,
    ry: 3,
    maxRx: 34 + Math.random() * 14,
    maxRy: 14 + Math.random() * 6,
    alpha: 0.78
  };
  puddles.push(puddle);
  beagle.activePuddle = puddle;
  setState('pee', 3.6);
  startPeeSound();
}

function startPoopSequence() {
  beagle.circleCenterX = beagle.x;
  beagle.circleCenterY = beagle.y;
  beagle.circleAngle = 0;
  beagle.poopDropped = false;
  setState('circle', 2.4);
}

// 按钮交互函数
function giveWater() {
  initAudio();
  const tx = Math.min(Math.max(beagle.x + beagle.dir * 75, 100), width - 100);
  const ty = Math.min(Math.max(beagle.y + 10, height * 0.32), height * 0.88);
  treats.push({ x: tx, y: ty, type: 'water' });
  beagle.targetX = tx - beagle.dir * 45;
  beagle.targetY = ty;
  if (beagle.state !== 'pee' && beagle.state !== 'poop') {
    setState('walk', 5);
  }
}

function giveFood() {
  initAudio();
  const tx = Math.min(Math.max(beagle.x + beagle.dir * 75, 100), width - 100);
  const ty = Math.min(Math.max(beagle.y + 10, height * 0.32), height * 0.88);
  treats.push({ x: tx, y: ty, type: 'food' });
  beagle.targetX = tx - beagle.dir * 45;
  beagle.targetY = ty;
  if (beagle.state !== 'pee' && beagle.state !== 'poop') {
    setState('walk', 5);
  }
}

function forcePee() {
  initAudio();
  if (beagle.state === 'pee' || beagle.state === 'poop') return;
  beagle.peeMeter = 100;
  startPeeSequence();
}

function forcePoop() {
  initAudio();
  if (beagle.state === 'pee' || beagle.state === 'poop') return;
  beagle.poopMeter = 100;
  startPoopSequence();
}

function cleanAll() {
  initAudio();
  let cleaned = false;
  while (puddles.length > 0) {
    const p = puddles.pop();
    spawnSparkles(p.x, p.y);
    cleaned = true;
  }
  while (poops.length > 0) {
    const p = poops.pop();
    spawnSparkles(p.x, p.y);
    cleaned = true;
  }
  if (cleaned) {
    playPopSound();
    beagle.happyTimer = 2.0;
    setTimeout(playBark, 180);
  }
}

function spawnSparkles(x, y) {
  for (let i = 0; i < 12; i++) {
    const ang = (Math.PI * 2 * i) / 12;
    const spd = 40 + Math.random() * 60;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 20,
      life: 0.6 + Math.random() * 0.3,
      maxLife: 0.9,
      color: i % 2 === 0 ? '#fff59d' : '#a5d6a7',
      size: 3 + Math.random() * 3
    });
  }
}

// 画布点击：清理排泄物或引导散步
canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // 优先检测是否点击了便便
  for (let i = poops.length - 1; i >= 0; i--) {
    const p = poops[i];
    if (Math.hypot(mx - p.x, my - p.y) < 34) {
      poops.splice(i, 1);
      spawnSparkles(p.x, p.y);
      playPopSound();
      beagle.happyTimer = 1.8;
      playBark();
      return;
    }
  }

  // 检测是否点击了尿渍
  for (let i = puddles.length - 1; i >= 0; i--) {
    const p = puddles[i];
    if (Math.hypot(mx - p.x, my - p.y) < Math.max(p.rx + 12, 30)) {
      puddles.splice(i, 1);
      spawnSparkles(p.x, p.y);
      playPopSound();
      beagle.happyTimer = 1.5;
      return;
    }
  }

  // 引导比格犬走过去
  if (my > height * 0.24 && beagle.state !== 'pee' && beagle.state !== 'poop') {
    beagle.targetX = Math.min(Math.max(mx, 80), width - 80);
    beagle.targetY = Math.min(Math.max(my, height * 0.28), height * 0.90);
    setState('walk', 6);
    particles.push({
      x: mx, y: my, vx: 0, vy: 0,
      life: 0.45, maxLife: 0.45,
      color: 'rgba(255,255,255,0.65)', size: 12, isRing: true
    });
  }
});

// 状态更新循环
function update(dt) {
  beagle.breathPhase += dt * 3.2;
  beagle.tailPhase += dt * (beagle.happyTimer > 0 ? 18 : 8);
  if (beagle.happyTimer > 0) beagle.happyTimer -= dt;

  // 眨眼逻辑
  beagle.blinkTimer -= dt;
  if (beagle.blinkTimer <= 0) {
    if (!beagle.isBlinking) {
      beagle.isBlinking = true;
      beagle.blinkTimer = 0.14;
    } else {
      beagle.isBlinking = false;
      beagle.blinkTimer = 2.2 + Math.random() * 3.0;
    }
  }

  // 自然积攒尿意与便意
  if (beagle.state !== 'pee') {
    beagle.peeMeter = Math.min(100, beagle.peeMeter + dt * 2.4);
  }
  if (beagle.state !== 'poop' && beagle.state !== 'circle') {
    beagle.poopMeter = Math.min(100, beagle.poopMeter + dt * 1.7);
  }

  // 更新HUD进度条
  document.getElementById('pee-bar').style.width = `${Math.round(beagle.peeMeter)}%`;
  document.getElementById('pee-pct').textContent = `${Math.round(beagle.peeMeter)}%`;
  document.getElementById('poop-bar').style.width = `${Math.round(beagle.poopMeter)}%`;
  document.getElementById('poop-pct').textContent = `${Math.round(beagle.poopMeter)}%`;

  // 检查是否到达食盆/水碗
  for (let i = treats.length - 1; i >= 0; i--) {
    const t = treats[i];
    const dist = Math.hypot(beagle.x + beagle.dir * 45 - t.x, beagle.y + 15 - t.y);
    if (dist < 38 && beagle.state !== 'pee' && beagle.state !== 'poop') {
      beagle.dir = t.x >= beagle.x ? 1 : -1;
      setState('eat', 2.0);
      if (t.type === 'water') {
        beagle.peeMeter = Math.min(100, beagle.peeMeter + 48);
      } else {
        beagle.poopMeter = Math.min(100, beagle.poopMeter + 52);
      }
      treats.splice(i, 1);
      break;
    }
  }

  // 状态机行为
  beagle.stateTimer -= dt;

  if (beagle.state === 'walk') {
    const dx = beagle.targetX - beagle.x;
    const dy = beagle.targetY - beagle.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 8) {
      const speed = 95;
      beagle.x += (dx / dist) * speed * dt;
      beagle.y += (dy / dist) * speed * dt;
      if (Math.abs(dx) > 4) beagle.dir = dx > 0 ? 1 : -1;
      beagle.walkPhase += dt * 11;
    } else {
      // 抵达目标点后决定下一步动作
      if (beagle.peeMeter >= 88 && Math.random() < 0.75) {
        startPeeSequence();
      } else if (beagle.poopMeter >= 88 && Math.random() < 0.75) {
        startPoopSequence();
      } else if (Math.random() < 0.55) {
        setState('sniff', 2.2 + Math.random() * 1.8);
      } else {
        setState('idle', 1.8 + Math.random() * 1.5);
      }
    }
  } else if (beagle.state === 'idle' || beagle.state === 'sniff') {
    if (beagle.peeMeter >= 95) {
      startPeeSequence();
    } else if (beagle.poopMeter >= 95) {
      startPoopSequence();
    } else if (beagle.stateTimer <= 0) {
      pickRandomTarget();
      setState('walk', 7);
    }
  } else if (beagle.state === 'eat') {
    if (beagle.stateTimer <= 0) {
      if (beagle.peeMeter >= 85) {
        startPeeSequence();
      } else if (beagle.poopMeter >= 85) {
        startPoopSequence();
      } else {
        pickRandomTarget();
        setState('walk', 6);
      }
    }
  } else if (beagle.state === 'circle') {
    // 拉屎前经典的原地转圈嗅地动作
    beagle.circleAngle += dt * 5.2;
    beagle.x = beagle.circleCenterX + Math.cos(beagle.circleAngle) * 18;
    beagle.y = beagle.circleCenterY + Math.sin(beagle.circleAngle) * 9;
    beagle.dir = Math.sin(beagle.circleAngle) < 0 ? 1 : -1;
    beagle.walkPhase += dt * 13;
    if (beagle.stateTimer <= 0) {
      setState('poop', 3.4);
    }
  } else if (beagle.state === 'pee') {
    beagle.actionProgress = Math.min(1, 1 - beagle.stateTimer / 3.6);
    if (beagle.activePuddle) {
      beagle.activePuddle.rx = Math.min(beagle.activePuddle.maxRx, beagle.activePuddle.rx + dt * 10);
      beagle.activePuddle.ry = Math.min(beagle.activePuddle.maxRy, beagle.activePuddle.ry + dt * 4.2);
    }
    // 尿液水柱粒子
    if (beagle.actionProgress > 0.15 && beagle.actionProgress < 0.88 && Math.random() < 0.7) {
      const startX = beagle.x - beagle.dir * 16;
      const startY = beagle.y + 12;
      particles.push({
        x: startX,
        y: startY,
        vx: -beagle.dir * (18 + Math.random() * 14),
        vy: 55 + Math.random() * 25,
        life: 0.36,
        maxLife: 0.36,
        color: 'rgba(247, 224, 108, 0.82)',
        size: 2.6,
        isStream: true
      });
    }
    if (beagle.stateTimer <= 0) {
      stopPeeSound();
      beagle.peeMeter = 0;
      beagle.activePuddle = null;
      beagle.happyTimer = 1.2;
      pickRandomTarget();
      setState('walk', 6);
    }
  } else if (beagle.state === 'poop') {
    beagle.actionProgress = Math.min(1, 1 - beagle.stateTimer / 3.4);
    // 蹲到一半时掉落便便
    if (beagle.actionProgress > 0.52 && !beagle.poopDropped) {
      beagle.poopDropped = true;
      poops.push({
        x: beagle.x - beagle.dir * 38,
        y: beagle.y + 34,
        scale: 0.9 + Math.random() * 0.25,
        age: 0,
        flyAngle: Math.random() * Math.PI * 2
      });
    }
    if (beagle.stateTimer <= 0) {
      beagle.poopMeter = 0;
      beagle.happyTimer = 1.5;
      playBark();
      pickRandomTarget();
      setState('walk', 6);
    }
  }

  // 更新便便热气与苍蝇
  for (const p of poops) {
    p.age += dt;
    p.flyAngle += dt * 4.5;
  }

  // 更新粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    if (pt.isStream) pt.vy += 180 * dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

// 绘制背景阳光草地公园
function drawEnvironment() {
  // 天空与远景树林渐变
  const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.28);
  skyGrad.addColorStop(0, '#8cc5e8');
  skyGrad.addColorStop(0.65, '#cde6d5');
  skyGrad.addColorStop(1, '#689e54');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, width, height * 0.28);

  // 远景柔和灌木轮廓
  ctx.fillStyle = '#4e8240';
  ctx.beginPath();
  ctx.moveTo(0, height * 0.26);
  for (let x = 0; x <= width + 80; x += 70) {
    const hump = Math.sin(x * 0.015) * 16 + Math.cos(x * 0.03) * 10;
    ctx.quadraticCurveTo(x + 35, height * 0.19 + hump, x + 70, height * 0.26);
  }
  ctx.lineTo(width, height * 0.30);
  ctx.lineTo(0, height * 0.30);
  ctx.closePath();
  ctx.fill();

  // 主草地渐变（带阳光暖调）
  const grassGrad = ctx.createLinearGradient(0, height * 0.24, 0, height);
  grassGrad.addColorStop(0, '#5a9447');
  grassGrad.addColorStop(0.45, '#4b823a');
  grassGrad.addColorStop(1, '#366328');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, height * 0.24, width, height * 0.76);

  // 阳光光晕斜射
  const sunGlow = ctx.createRadialGradient(width * 0.18, height * 0.12, 20, width * 0.25, height * 0.25, width * 0.65);
  sunGlow.addColorStop(0, 'rgba(255, 248, 210, 0.26)');
  sunGlow.addColorStop(1, 'rgba(255, 248, 210, 0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, width, height);

  // 草丛细节
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  for (const g of grassTufts) {
    ctx.strokeStyle = g.shade;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    ctx.quadraticCurveTo(g.x + g.lean * 0.4, g.y - g.h * 0.6, g.x + g.lean, g.y - g.h);
    ctx.moveTo(g.x + 3, g.y);
    ctx.quadraticCurveTo(g.x + 3 - g.lean * 0.3, g.y - g.h * 0.5, g.x + 3 - g.lean * 0.7, g.y - g.h * 0.85);
    ctx.stroke();
  }

  // 野花与蒲公英
  for (const d of dandelions) {
    ctx.fillStyle = d.isWhite ? 'rgba(255,255,255,0.85)' : '#f5d142';
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 绘制地面的尿渍与便便
function drawWasteAndTreats() {
  // 尿渍
  for (const p of puddles) {
    ctx.save();
    ctx.translate(p.x, p.y);
    const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, p.rx);
    grad.addColorStop(0, 'rgba(214, 184, 58, 0.62)');
    grad.addColorStop(0.7, 'rgba(186, 162, 48, 0.42)');
    grad.addColorStop(1, 'rgba(70, 110, 45, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.rx, p.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // 湿润反光高光
    ctx.fillStyle = 'rgba(255, 250, 210, 0.32)';
    ctx.beginPath();
    ctx.ellipse(-p.rx * 0.22, -p.ry * 0.25, p.rx * 0.35, p.ry * 0.22, -0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 便便（带质感、热气与盘旋小苍蝇）
  for (const p of poops) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(p.scale, p.scale);

    // 地面阴影
    ctx.fillStyle = 'rgba(20, 38, 16, 0.38)';
    ctx.beginPath();
    ctx.ellipse(0, 5, 16, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // 写实分段螺旋便便造型
    const layers = [
      { y: 2, rx: 13, ry: 5.5, c1: '#6e4726', c2: '#472b14' },
      { y: -3, rx: 10, ry: 4.8, c1: '#7d522d', c2: '#523218' },
      { y: -8, rx: 6.5, ry: 4.0, c1: '#8c5d35', c2: '#5c381c' }
    ];
    for (const l of layers) {
      const g = ctx.createLinearGradient(-l.rx, l.y - l.ry, l.rx, l.y + l.ry);
      g.addColorStop(0, l.c1);
      g.addColorStop(1, l.c2);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, l.y, l.rx, l.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      // 湿润高光
      ctx.fillStyle = 'rgba(255, 235, 210, 0.16)';
      ctx.beginPath();
      ctx.ellipse(-l.rx * 0.25, l.y - l.ry * 0.3, l.rx * 0.4, l.ry * 0.22, -0.2, 0, Math.PI * 2);
      ctx.fill();
    }
    // 尖顶
    ctx.fillStyle = '#7d522d';
    ctx.beginPath();
    ctx.moveTo(-3, -10);
    ctx.quadraticCurveTo(2, -16, 4, -13);
    ctx.quadraticCurveTo(3, -9, 2, -9);
    ctx.fill();

    // 新鲜袅袅热气（前25秒）
    if (p.age < 25) {
      const steamAlpha = Math.max(0, (1 - p.age / 25) * 0.38);
      ctx.strokeStyle = `rgba(255, 255, 255, ${steamAlpha})`;
      ctx.lineWidth = 1.6;
      for (let s = -1; s <= 1; s += 2) {
        ctx.beginPath();
        const wave = Math.sin(p.age * 3 + s) * 3;
        ctx.moveTo(s * 4, -15);
        ctx.quadraticCurveTo(s * 4 + wave, -24, s * 4 - wave, -34);
        ctx.stroke();
      }
    }

    // 盘旋小苍蝇（超过4秒后出现）
    if (p.age > 4) {
      const fx = Math.cos(p.flyAngle) * 18;
      const fy = -22 + Math.sin(p.flyAngle * 2) * 5;
      ctx.fillStyle = '#1f2421';
      ctx.beginPath();
      ctx.arc(fx, fy, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(fx - 1.5, fy - 1.5, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // 绘制投放的水碗或狗粮
  for (const t of treats) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.fillStyle = 'rgba(20, 38, 16, 0.32)';
    ctx.beginPath();
    ctx.ellipse(0, 6, 18, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // 不锈钢食盆
    ctx.fillStyle = t.type === 'water' ? '#4a90e2' : '#d97b38';
    ctx.beginPath();
    ctx.ellipse(0, 2, 16, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e0e6ed';
    ctx.beginPath();
    ctx.ellipse(0, -1, 14, 5.5, 0, 0, Math.PI * 2);
    ctx.fill();

    if (t.type === 'water') {
      ctx.fillStyle = '#73c2fb';
      ctx.beginPath();
      ctx.ellipse(0, -0.5, 11.5, 4.2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#7a4922';
      for (let k = -6; k <= 6; k += 4) {
        ctx.beginPath();
        ctx.arc(k, -1 + (k % 3), 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

// 绘制写实三色比格犬
function drawBeagle() {
  // 透视缩放：越靠近屏幕下方略大
  const depthScale = 0.85 + ((beagle.y - height * 0.25) / (height * 0.75)) * 0.32;

  ctx.save();
  ctx.translate(beagle.x, beagle.y);
  ctx.scale(depthScale * beagle.dir, depthScale);

  const isWalking = beagle.state === 'walk' || beagle.state === 'circle';
  const isPeeing = beagle.state === 'pee';
  const isPooping = beagle.state === 'poop';
  const isSniffing = beagle.state === 'sniff' || beagle.state === 'eat';

  const walkSin = isWalking ? Math.sin(beagle.walkPhase) : 0;
  const walkCos = isWalking ? Math.cos(beagle.walkPhase) : 0;
  const breath = Math.sin(beagle.breathPhase) * 1.5;

  // 拉屎弓背与下蹲偏移
  const squatOffset = isPooping ? Math.sin(Math.min(1, beagle.actionProgress * 2) * Math.PI * 0.5) * 12 : 0;
  const bodyTilt = isPooping ? -0.24 : (isSniffing ? 0.14 : 0);

  // 1. 地面接触阴影
  ctx.save();
  ctx.fillStyle = 'rgba(18, 36, 14, 0.38)';
  ctx.beginPath();
  ctx.ellipse(0, 36, 54, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(0, squatOffset);
  ctx.rotate(bodyTilt);

  // 2. 远侧两条腿（颜色略深营造立体纵深）
  drawLeg(-28, 12, isWalking ? -walkSin * 14 : (isPooping ? 8 : 0), '#c8ccd0', '#b4b8bc', false);
  drawLeg(26, 12, isWalking ? walkSin * 14 : 0, '#c8ccd0', '#b4b8bc', false);

  // 3. 比格犬标志性“小白旗”尾巴
  ctx.save();
  ctx.translate(-42, -6 + breath * 0.5);
  const tailWag = isPooping ? 0.45 : Math.sin(beagle.tailPhase) * (beagle.happyTimer > 0 ? 0.36 : 0.14);
  ctx.rotate(-0.55 + tailWag);
  // 尾巴根部深棕/黑
  ctx.fillStyle = '#2c2520';
  ctx.beginPath();
  ctx.moveTo(0, -4);
  ctx.quadraticCurveTo(-16, -18, -22, -32);
  ctx.quadraticCurveTo(-14, -34, -8, -22);
  ctx.quadraticCurveTo(-2, -10, 4, 2);
  ctx.closePath();
  ctx.fill();
  // 尾尖纯白
  ctx.fillStyle = '#f7f6f2';
  ctx.beginPath();
  ctx.moveTo(-14, -22);
  ctx.quadraticCurveTo(-20, -30, -23, -36);
  ctx.quadraticCurveTo(-15, -37, -11, -27);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 4. 躯干主体（白色底毛 + 经典黑色鞍背 + 棕褐色过渡）
  // 躯干轮廓
  const bodyGrad = ctx.createLinearGradient(0, -24, 0, 22);
  bodyGrad.addColorStop(0, '#f7f5f0');
  bodyGrad.addColorStop(0.75, '#efece4');
  bodyGrad.addColorStop(1, '#d8d4cb');

  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-42, -4);
  ctx.bezierCurveTo(-44, -22, -18, -25 + breath, 12, -23 + breath);
  ctx.bezierCurveTo(32, -22, 44, -12, 42, 6);
  ctx.bezierCurveTo(38, 20, 14, 22, -14, 18);
  ctx.bezierCurveTo(-34, 16, -42, 8, -42, -4);
  ctx.closePath();
  ctx.fill();

  // 棕褐色肩部与臀部边缘过渡（Saddle Tan）
  ctx.fillStyle = '#b86f35';
  ctx.beginPath();
  ctx.ellipse(-8, -8 + breath * 0.5, 29, 14, -0.06, Math.PI * 0.95, Math.PI * 2.08);
  ctx.fill();

  // 经典纯黑鞍背斑纹（Black Saddle）
  const saddleGrad = ctx.createLinearGradient(0, -24, 0, 4);
  saddleGrad.addColorStop(0, '#231f1d');
  saddleGrad.addColorStop(1, '#3b332e');
  ctx.fillStyle = saddleGrad;
  ctx.beginPath();
  ctx.moveTo(-34, -10);
  ctx.bezierCurveTo(-26, -24 + breath, 8, -24 + breath, 18, -12);
  ctx.bezierCurveTo(12, -1, -18, 2, -34, -10);
  ctx.closePath();
  ctx.fill();

  // 5. 近侧前腿
  drawLeg(24, 12 - squatOffset * 0.4, isWalking ? -walkSin * 15 : 0, '#f7f5f0', '#e2dfd7', true);

  // 6. 近侧后腿（撒尿时高高抬起！）
  if (isPeeing) {
    ctx.save();
    ctx.translate(-26, 8);
    // 抬腿角度随进度平滑展开
    const lift = Math.sin(Math.min(1, beagle.actionProgress * 3) * Math.PI * 0.5);
    ctx.rotate(-lift * 1.25);
    // 大腿棕褐色
    ctx.fillStyle = '#c4783b';
    ctx.beginPath();
    ctx.ellipse(0, 6, 9, 13, 0.2, 0, Math.PI * 2);
    ctx.fill();
    // 小腿与白爪
    ctx.fillStyle = '#f7f5f0';
    ctx.beginPath();
    ctx.roundRect(-5, 12, 10, 16, 4);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(2, 28, 7, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else {
    drawLeg(-26, 12, isWalking ? walkSin * 15 : (isPooping ? 12 : 0), '#f7f5f0', '#e2dfd7', true, true);
  }

  // 7. 脖颈与头部（支持低头嗅闻与进食动作）
  ctx.save();
  const neckX = 34;
  const neckY = -12 + breath * 0.5;
  ctx.translate(neckX, neckY);
  const headPitch = isSniffing ? 0.58 + Math.sin(beagle.breathPhase * 2.5) * 0.08 : (isPooping ? 0.18 : 0);
  ctx.rotate(headPitch);

  // 脖颈（后侧棕褐，前胸雪白）
  ctx.fillStyle = '#c27638';
  ctx.beginPath();
  ctx.moveTo(-10, 8);
  ctx.lineTo(-4, -18);
  ctx.lineTo(14, -16);
  ctx.lineTo(14, 14);
  ctx.closePath();
  ctx.fill();

  // 前胸白毛（Blaze chest）
  ctx.fillStyle = '#faf9f5';
  ctx.beginPath();
  ctx.moveTo(4, -12);
  ctx.quadraticCurveTo(18, -2, 12, 18);
  ctx.lineTo(0, 14);
  ctx.closePath();
  ctx.fill();

  // 头部轮廓（经典棕褐色头颅）
  const headGrad = ctx.createRadialGradient(8, -22, 4, 8, -18, 24);
  headGrad.addColorStop(0, '#d48746');
  headGrad.addColorStop(1, '#a65d24');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.ellipse(8, -20, 17, 15, -0.1, 0, Math.PI * 2);
  ctx.fill();

  // 额头中央标志性白色鼻梁纹（White Blaze）
  ctx.fillStyle = '#faf9f5';
  ctx.beginPath();
  ctx.moveTo(14, -33);
  ctx.quadraticCurveTo(21, -24, 24, -16);
  ctx.lineTo(16, -16);
  ctx.quadraticCurveTo(16, -24, 14, -33);
  ctx.closePath();
  ctx.fill();

  // 吻部（白色方正小嘴筒）
  ctx.fillStyle = '#f7f5f0';
  ctx.beginPath();
  ctx.roundRect(15, -20, 18, 12, [4, 7, 7, 5]);
  ctx.fill();

  // 嘴角微笑线条
  ctx.strokeStyle = '#3a2c24';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(20, -11);
  ctx.quadraticCurveTo(26, -10, 31, -13);
  ctx.stroke();

  // 湿润黑鼻子（带高光）
  ctx.fillStyle = '#1b1817';
  ctx.beginPath();
  ctx.ellipse(31.5, -17.5, 4.2, 3.2, 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(30.8, -18.5, 1.5, 0.9, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // 琥珀色深邃大眼睛
  if (beagle.isBlinking || isPooping) {
    ctx.strokeStyle = '#2b1e16';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(13, -22);
    ctx.quadraticCurveTo(16, -20, 19, -22);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#2b180c';
    ctx.beginPath();
    ctx.arc(16, -22, 3.3, 0, Math.PI * 2);
    ctx.fill();
    // 眼神高光
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(17, -23, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // 丝绒般长垂耳（Beagle标志性大耳朵，随步伐轻摆）
  ctx.save();
  ctx.translate(2, -23);
  const earSwing = isWalking ? walkCos * 0.12 : Math.sin(beagle.breathPhase) * 0.03;
  ctx.rotate(earSwing);
  const earGrad = ctx.createLinearGradient(0, 0, 0, 28);
  earGrad.addColorStop(0, '#9c541e');
  earGrad.addColorStop(1, '#7a3e12');
  ctx.fillStyle = earGrad;
  ctx.beginPath();
  ctx.moveTo(-4, -2);
  ctx.bezierCurveTo(-13, 6, -14, 24, -4, 27);
  ctx.bezierCurveTo(6, 28, 9, 14, 4, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.restore(); // 结束头部变换
  ctx.restore(); // 结束躯干变换
  ctx.restore(); // 结束整体变换
}

function drawLeg(x, y, swingX, topColor, bottomColor, isFrontLayer, hasBrownThigh = false) {
  ctx.save();
  ctx.translate(x, y);
  const angle = swingX * 0.045;
  ctx.rotate(angle);

  // 大腿/上臂
  ctx.fillStyle = hasBrownThigh ? '#c4783b' : topColor;
  ctx.beginPath();
  ctx.ellipse(0, 5, 7.5, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // 小腿
  ctx.fillStyle = bottomColor;
  ctx.beginPath();
  ctx.roundRect(-4.5, 10, 9, 14, 4);
  ctx.fill();

  // 圆润白爪
  ctx.fillStyle = isFrontLayer ? '#faf9f5' : '#d5d8dc';
  ctx.beginPath();
  ctx.ellipse(2.5, 24, 6.8, 4.2, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawParticles() {
  for (const pt of particles) {
    const alpha = Math.max(0, pt.life / pt.maxLife);
    ctx.save();
    if (pt.isRing) {
      ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.7})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(pt.x, pt.y, (1 - alpha) * 26 + 4, (1 - alpha) * 11 + 2, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// 主动画循环
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  update(dt);

  ctx.clearRect(0, 0, width, height);
  drawEnvironment();
  drawWasteAndTreats();
  drawBeagle();
  drawParticles();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
